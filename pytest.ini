[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -q
markers =
    smoke: quick sanity check (run on every commit)
    regression: full regression suite
    grpc: tests requiring gRPC stubs to be generated
    slow: tests that take > 5 seconds
