global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:8001"]

  - job_name: "inventory-service"
    static_configs:
      - targets: ["inventory-service:8002"]

  - job_name: "fulfillsentry-tests"
    static_configs:
      - targets: ["host.docker.internal:9091"]
    metrics_path: /metrics
